<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Murmure</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="card" id="card" data-state="idle">
      <div class="glow" aria-hidden="true"></div>

      <!-- Bandeau compact : etat + forme d'onde + chrono -->
      <header class="strip" data-tauri-drag-region>
        <button
          type="button"
          class="record-control"
          id="btn-stop"
          data-i18n-label="overlay.stopLabel"
          data-i18n-title="overlay.stopTitle"
          disabled
        >
          <span class="pulse" aria-hidden="true"></span>
        </button>

        <div class="wave" id="wave" aria-hidden="true"></div>

        <div class="meta">
          <span class="timer" id="timer">00:00</span>
          <span class="hint" id="hint"></span>
        </div>

        <button
          type="button"
          class="close-overlay"
          id="btn-close"
          data-i18n-label="overlay.closeLabel"
          data-i18n-title="overlay.closeTitle"
        >
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <!-- Zone de relecture, masquee tant qu'il n'y a pas de texte -->
      <section class="review" id="review">
        <div class="text" id="text" contenteditable="true" spellcheck="false"></div>
        <footer class="actions">
          <span class="badge" id="badge"></span>
          <div class="spacer"></div>
          <button class="btn ghost" id="btn-redo" data-i18n="overlay.redo">Redo</button>
          <button class="btn primary" id="btn-copy" data-i18n="overlay.copy">Copy</button>
        </footer>
      </section>
    </div>

    <script type="module" src="overlay.js"></script>
  </body>
</html>
