<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Murmure</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="sidebar">
        <button class="cta" id="btn-dictate">
          <span class="icon icon-mic" aria-hidden="true"></span>
          <span id="cta-label" data-i18n="nav.dictate">Dictate</span>
          <kbd id="cta-hotkey"></kbd>
        </button>

        <button class="nav-item" data-tab="files">
          <span class="icon icon-files" aria-hidden="true"></span>
          <span data-i18n="nav.files">Files</span>
        </button>
        <button class="nav-item" data-tab="models">
          <span class="icon icon-models" aria-hidden="true"></span>
          <span data-i18n="nav.models">Models</span>
        </button>
        <button class="nav-item active" data-tab="history">
          <span class="icon icon-history" aria-hidden="true"></span>
          <span data-i18n="nav.history">History</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <span class="icon icon-settings" aria-hidden="true"></span>
          <span data-i18n="nav.settings">Settings</span>
        </button>

        <div class="sidebar-foot">
          <!-- Barre de progression : telechargement de modele, ou lot de fichiers -->
          <div class="progress" id="progress" hidden>
            <div class="progress-label" id="progress-label"></div>
            <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
          </div>

          <div class="status" id="status">
            <span class="dot" id="status-dot"></span>
            <span id="status-text" data-i18n="status.connecting">Connecting…</span>
          </div>
          <div class="stat" id="stats"></div>
        </div>
      </nav>

      <main class="content">
        <!-- ------------------------------------------------ Historique -->
        <section class="panel active" data-panel="history">
          <header class="panel-head">
            <div class="history-heading">
              <h1 data-i18n="history.title">History</h1>
              <div class="history-summary" id="history-summary" aria-live="polite">
                <span id="history-count"></span>
                <span class="summary-separator" aria-hidden="true"></span>
                <span id="history-duration"></span>
              </div>
              <button class="btn-outline" id="btn-audio-folder" type="button">
                <span class="icon icon-folder" aria-hidden="true"></span>
                <span data-i18n="history.audioFolder">Audio folder</span>
              </button>
            </div>
            <input
              type="search"
              id="search"
              class="search"
              data-i18n-placeholder="history.search"
              autocomplete="off"
            />
          </header>
          <div class="list" id="history-list"></div>
        </section>

        <!-- -------------------------------------------------- Fichiers -->
        <section class="panel" data-panel="files">
          <header class="panel-head">
            <h1 data-i18n="files.title">Transcribe files</h1>
            <p class="sub" data-i18n="files.sub"></p>
          </header>

          <div class="drop" id="drop">
            <div class="drop-inner">
              <div class="drop-icon"></div>
              <p class="drop-title" data-i18n="files.dropTitle">Drop your files here</p>
              <p class="drop-sub" id="drop-formats"></p>
              <button class="btn-solid" id="btn-pick" data-i18n="files.browse">Browse…</button>
            </div>
          </div>

          <!-- Rappel des reglages de diarisation la ou on s'en sert. Ils sont
               au complet dans Réglages ; ces deux-ci sont ceux qu'on change au
               moment de deposer un fichier, parce que c'est a ce moment-la
               qu'on sait combien de gens parlent dans l'enregistrement. -->
          <div class="form form-inline" id="diarize-form">
            <label class="row switch">
              <span class="label">
                <span data-i18n="settings.diarizeOn">Identify speakers</span>
                <em class="diarize-hint"></em>
              </span>
              <input type="checkbox" id="files-diarize_files" data-setting="diarize_files" />
            </label>

            <label class="row diarize-count-row">
              <span class="label">
                <span data-i18n="settings.diarizeCount">Number of people</span>
                <em data-i18n="settings.diarizeCountHint"></em>
              </span>
              <select
                id="files-diarize_speakers"
                class="input speaker-count"
                data-setting="diarize_speakers"
              ></select>
            </label>
          </div>

          <div class="jobs" id="jobs"></div>
        </section>

        <!-- --------------------------------------------------- Modèles -->
        <section class="panel" data-panel="models">
          <header class="panel-head">
            <h1 data-i18n="models.title">Models</h1>
            <p class="sub" data-i18n="models.sub"></p>
          </header>
          <div class="cards" id="model-cards"></div>
        </section>

        <!-- -------------------------------------------------- Réglages -->
        <section class="panel" data-panel="settings">
          <header class="panel-head"><h1 data-i18n="settings.title">Settings</h1></header>

          <div class="form" id="settings-form">
            <fieldset>
              <legend data-i18n="settings.interface">Interface</legend>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.language">Language</span>
                  <em data-i18n="settings.languageHint"></em>
                </span>
                <select id="ui-language" class="input"></select>
              </label>

              <div class="row">
                <span class="label">
                  <span data-i18n="settings.palette">Palette</span>
                  <em data-i18n="settings.paletteHint"></em>
                </span>
                <div
                  class="palette-picker"
                  id="appearance-palette"
                  role="group"
                  data-i18n-label="settings.palette"
                >
                  <button
                    type="button"
                    class="palette-swatch"
                    data-palette="magenta-blue"
                    data-i18n-label="settings.paletteMagenta"
                    data-i18n-title="settings.paletteMagenta"
                  ></button>
                  <button
                    type="button"
                    class="palette-swatch"
                    data-palette="rose-violet"
                    data-i18n-label="settings.paletteRose"
                    data-i18n-title="settings.paletteRose"
                  ></button>
                  <button
                    type="button"
                    class="palette-swatch"
                    data-palette="violet-azure"
                    data-i18n-label="settings.paletteViolet"
                    data-i18n-title="settings.paletteViolet"
                  ></button>
                </div>
              </div>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.density">Background density</span>
                  <em data-i18n="settings.densityHint"></em>
                </span>
                <span class="range">
                  <input type="range" id="appearance-density" min="72" max="96" step="1" />
                  <output id="out-appearance-density"></output>
                </span>
              </label>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.trigger">Trigger</legend>

              <label class="row">
                <span class="label" data-i18n="settings.hotkey">Global hotkey</span>
                <input
                  type="text"
                  id="set-hotkey"
                  data-setting="hotkey"
                  class="input"
                  placeholder="Ctrl+Alt+Space"
                />
              </label>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.mode">Mode</span>
                  <em data-i18n="settings.modeHint"></em>
                </span>
                <select id="set-hotkey_mode" data-setting="hotkey_mode" class="input">
                  <option value="hold" data-i18n="settings.modeHold"></option>
                  <option value="toggle" data-i18n="settings.modeToggle"></option>
                </select>
              </label>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.dictation">Dictation mode</legend>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.whenText">When the text arrives</span>
                  <em data-i18n="settings.whenTextHint"></em>
                </span>
                <select id="set-dictation_mode" data-setting="dictation_mode" class="input">
                  <option value="differe" data-i18n="settings.modeDeferred"></option>
                  <option value="continu" data-i18n="settings.modeContinuous"></option>
                </select>
              </label>

              <label class="row switch">
                <span class="label">
                  <span data-i18n="settings.injectCursor">Type at the cursor</span>
                  <em data-i18n="settings.injectCursorHint"></em>
                </span>
                <input type="checkbox" id="set-inject_at_cursor" data-setting="inject_at_cursor" />
              </label>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.phraseSilence">End-of-sentence silence</span>
                  <em data-i18n="settings.phraseSilenceHint"></em>
                </span>
                <span class="range">
                  <input
                    type="range"
                    id="set-phrase_silence_ms"
                    data-setting="phrase_silence_ms"
                    min="400"
                    max="1500"
                    step="50"
                  />
                  <output id="out-phrase_silence_ms"></output>
                </span>
              </label>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.polish">Polish at each pause</span>
                  <em data-i18n="settings.polishHint"></em>
                </span>
                <select id="set-polish_mode" data-setting="polish_mode" class="input">
                  <option value="moteur" data-i18n="settings.polishOn"></option>
                  <option value="aucun" data-i18n="settings.polishOff"></option>
                </select>
              </label>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.preview">Preview while dictating</span>
                  <em data-i18n="settings.previewHint"></em>
                </span>
                <span class="range">
                  <input
                    type="range"
                    id="set-preview_ms"
                    data-setting="preview_ms"
                    min="0"
                    max="1500"
                    step="100"
                  />
                  <output id="out-preview_ms"></output>
                </span>
              </label>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.transcription">Transcription</legend>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.spokenLanguage">Spoken language</span>
                  <em data-i18n="settings.spokenLanguageHint"></em>
                </span>
                <select id="set-language" data-setting="language" class="input">
                  <option value="auto" data-i18n="settings.languageAuto"></option>
                  <option value="fr" data-i18n="settings.languageFr"></option>
                  <option value="en" data-i18n="settings.languageEn"></option>
                </select>
              </label>
            </fieldset>

            <!-- L'identification des locuteurs a ses propres reglages : elle
                 dispose de modeles a elle, qu'on peut vouloir installer avant
                 d'en avoir besoin ou effacer pour recuperer la place. -->
            <fieldset id="diarize-fieldset">
              <legend data-i18n="settings.speakers">Speaker identification</legend>
              <p class="fieldset-intro" data-i18n="settings.speakersIntro"></p>

              <label class="row switch">
                <span class="label">
                  <span data-i18n="settings.diarizeOn">Identify speakers</span>
                  <em class="diarize-hint"></em>
                </span>
                <input type="checkbox" id="set-diarize_files" data-setting="diarize_files" />
              </label>

              <label class="row diarize-count-row">
                <span class="label">
                  <span data-i18n="settings.diarizeCount">Number of people</span>
                  <em data-i18n="settings.diarizeCountHint"></em>
                </span>
                <select
                  id="set-diarize_speakers"
                  class="input speaker-count"
                  data-setting="diarize_speakers"
                ></select>
              </label>

              <label class="row" id="diarize-threshold-row">
                <span class="label">
                  <span data-i18n="settings.diarizeThreshold">Grouping sensitivity</span>
                  <em id="diarize-threshold-hint"></em>
                </span>
                <span class="range">
                  <input
                    type="range"
                    id="set-diarize_threshold"
                    data-setting="diarize_threshold"
                    min="0.3"
                    max="0.9"
                    step="0.05"
                  />
                  <output id="out-diarize_threshold"></output>
                </span>
              </label>

              <div class="row" id="diarize-models-row">
                <span class="label">
                  <span data-i18n="settings.diarizeModels">Speaker models</span>
                  <em id="diarize-models-hint"></em>
                </span>
                <span class="actions-inline">
                  <button
                    type="button"
                    class="btn-outline"
                    id="btn-diarize-download"
                    data-i18n="settings.diarizeDownloadNow"
                  ></button>
                  <button
                    type="button"
                    class="btn-outline"
                    id="btn-diarize-clear"
                    data-i18n="settings.diarizeRemove"
                  ></button>
                </span>
              </div>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.mic">Microphone</legend>

              <label class="row">
                <span class="label" data-i18n="settings.inputDevice">Input device</span>
                <select id="set-input_device" data-setting="input_device" class="input"></select>
              </label>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.preroll">Pre-recording</span>
                  <em data-i18n="settings.prerollHint"></em>
                </span>
                <span class="range">
                  <input
                    type="range"
                    id="set-preroll_ms"
                    data-setting="preroll_ms"
                    min="0"
                    max="1000"
                    step="50"
                  />
                  <output id="out-preroll_ms"></output>
                </span>
              </label>

              <label class="row">
                <span class="label">
                  <span data-i18n="settings.keepalive">Microphone held open</span>
                  <em data-i18n="settings.keepaliveHint"></em>
                </span>
                <span class="range">
                  <input
                    type="range"
                    id="set-mic_keepalive_s"
                    data-setting="mic_keepalive_s"
                    min="0"
                    max="300"
                    step="10"
                  />
                  <output id="out-mic_keepalive_s"></output>
                </span>
              </label>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.after">After the dictation</legend>

              <label class="row switch">
                <span class="label" data-i18n="settings.clipboard">Copy to the clipboard</span>
                <input type="checkbox" id="set-copy_to_clipboard" data-setting="copy_to_clipboard" />
              </label>

              <label class="row switch">
                <span class="label">
                  <span data-i18n="settings.reviewWindow">Show the review window</span>
                  <em data-i18n="settings.reviewWindowHint"></em>
                </span>
                <input
                  type="checkbox"
                  id="set-show_review_window"
                  data-setting="show_review_window"
                />
              </label>

              <label class="row switch">
                <span class="label">
                  <span data-i18n="settings.keepAudio">Keep the audio</span>
                  <em data-i18n="settings.keepAudioHint"></em>
                </span>
                <input type="checkbox" id="set-keep_audio" data-setting="keep_audio" />
              </label>

              <label class="row switch">
                <span class="label" data-i18n="settings.trimPeriod">Drop the final full stop</span>
                <input
                  type="checkbox"
                  id="set-trim_trailing_period"
                  data-setting="trim_trailing_period"
                />
              </label>
            </fieldset>

            <fieldset>
              <legend data-i18n="settings.engine">Engine</legend>

              <label class="row switch">
                <span class="label">
                  <span data-i18n="settings.gpu">Use the GPU</span>
                  <em data-i18n="settings.gpuHint"></em>
                </span>
                <input type="checkbox" id="set-prefer_gpu" data-setting="prefer_gpu" />
              </label>

              <label class="row switch">
                <span class="label">
                  <span data-i18n="settings.preload">Preload at startup</span>
                  <em data-i18n="settings.preloadHint"></em>
                </span>
                <input type="checkbox" id="set-preload_on_start" data-setting="preload_on_start" />
              </label>
            </fieldset>
          </div>
        </section>
      </main>
    </div>

    <dialog class="confirm-dialog" id="delete-dialog">
      <form method="dialog">
        <h2 data-i18n="dialog.deleteTitle">Delete this dictation?</h2>
        <p id="delete-message"></p>
        <div class="dialog-actions">
          <button class="btn-outline" value="cancel" data-i18n="dialog.cancel">Cancel</button>
          <button
            class="btn-danger"
            id="btn-confirm-delete"
            value="confirm"
            data-i18n="dialog.confirmDelete"
          >
            Delete
          </button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
