[project]
name = "murmure"
version = "0.1.0"
description = "Service local de dictee : modele resident, latence sub-seconde."
# Pas de `readme` : hatchling exige un chemin sous `backend/`, or le README du
# projet est a la racine du depot et couvre l'application entiere, pas ce
# paquet seul.
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    # Reechantillonnage des fichiers importes vers 16 kHz (media.py). Arrivait
    # jusqu'ici par transitivite : une resolution de dependances differente
    # aurait casse l'import de fichiers, sans que rien ne l'ait annonce.
    "soxr>=0.5",
    "platformdirs>=4.3",
    # --- moteur Parakeet / Canary (ONNX, sans torch ni NeMo) ---
    "onnx-asr[hub]>=0.11",
    # 1.24.1 est incompatible avec onnx-asr : on l'exclut explicitement.
    "onnxruntime-gpu>=1.20,!=1.24.1",
    # --- moteur Whisper (CTranslate2) ---
    "faster-whisper>=1.1",
    # --- diarisation : qui parle, et quand (import de fichiers) ---
    # ONNX pur, sans torch. pyannote.audio ferait le meme travail un peu mieux,
    # mais tirerait PyTorch — 2,5 Go, l'installation entiere doublee — et des
    # modeles a acces restreint. sherpa-onnx fait tourner le MEME modele de
    # segmentation pyannote, converti en ONNX, sur le runtime deja present.
    # Verifie : cohabite avec onnxruntime-gpu dans le meme processus.
    "sherpa-onnx>=1.12",
    # DLL CUDA 12 / cuDNN 9 requises par onnxruntime-gpu ET ctranslate2
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]

[project.optional-dependencies]
# `uv pip install -e ".[dev]"` — necessaire uniquement pour les tests et les
# scripts de verification, jamais pour faire tourner l'application.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Utilise par scripts/ws_check.py et scripts/file_check.py. Fourni aussi par
    # uvicorn[standard], mais on ne s'appuie pas sur l'extra d'un tiers.
    "websockets>=13.0",
]

[project.scripts]
murmure = "murmure.__main__:main"

[project.urls]
Homepage = "https://github.com/OnadjaPalamanga/Murmure"
Source = "https://github.com/OnadjaPalamanga/Murmure"
Issues = "https://github.com/OnadjaPalamanga/Murmure/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmure"]

# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# BLE : le code attrape `Exception` a une vingtaine d'endroits, toujours a
# dessein — un hook du frontend, un warmup ou un apercu qui echoue ne doit
# jamais casser une dictee en cours. La regle laisse passer les gestionnaires
# qui journalisent, et signale ceux qui avalent l'erreur en silence.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "RUF"]
ignore = [
    # Le code est commente en francais, y compris dans les chaines destinees a
    # l'utilisateur : les caracteres ambigus signales par RUF001/RUF002/RUF003
    # sont des apostrophes typographiques et des guillemets voulus.
    "RUF001",
    "RUF002",
    "RUF003",
    # RUF100 supprime les `# noqa` qu'il juge inutiles — et avec eux la
    # justification qui les suit (« # noqa: BLE001 - un abonne casse n'arrete
    # rien »). Ces lignes documentent des decisions ; la regle les a deja
    # effacees une fois. Un `noqa` de trop ne casse rien, une intention perdue
    # se paie a la relecture suivante.
    "RUF100",
]
# Annotations de type : affaire de l'editeur, pas de ruff. Declare ici pour que
# les codes `ANN0xx` des `# noqa` existants soient reconnus comme legitimes.
external = ["ANN"]

[tool.ruff.lint.per-file-ignores]
# Les scripts de verification ajustent sys.path avant d'importer murmure : les
# imports ne peuvent pas etre en tete de fichier.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
