name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform Murmure actually runs on: %APPDATA% paths,
        # CREATE_NO_WINDOW, pythonw.exe and CRLF line endings are only ever
        # exercised there. Ubuntu stays in the matrix because it is faster and
        # catches anything that quietly assumed a Windows path separator.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      # Pinned, and kept in a file rather than spelled out here — see the
      # comments in requirements-ci.txt for why the runtime stack is excluded.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r backend/requirements-ci.txt

      - name: Lint
        working-directory: backend
        run: ruff check --output-format=github .

      - name: Tests
        working-directory: backend
        run: pytest

  consistency:
    name: Cross-language constants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SETTINGS_REVISION lives in two languages and must move as one. The
      # README asks contributors to remember; this makes forgetting impossible.
      # Same for the version, which is spelled out in five files.
      - name: Check SETTINGS_REVISION and version agree
        run: python .github/scripts/check_constants.py

  frontend:
    name: Frontend — Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # No npm step: `frontendDist` points at static HTML/CSS/JS, there is
      # nothing to bundle before the Rust side can be checked.
      - name: Formatting
        working-directory: frontend/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: frontend/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Advisory-only: a freshly disclosed advisory in a transitive dependency
      # should raise a flag, not block an unrelated pull request at 2 a.m.
      - name: Python advisories
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement backend/requirements-ci.txt --strict

      - uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: frontend/src-tauri
